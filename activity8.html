<html>
    <head>

        <title>my color card</title>

        <style>
            *{
                font size: 16px;
            }

            /* element selectors*/
            body{
                background-color: pink;
            }

            h1{
                color: darkblue
            }

            h2{
                color:purple
            }

            p{
                color:black
            }
            
            /*class selector*/
            .my-detail{
                color:darkgreen
                font-weight: bold;
            }

            /* id selector */
            #my-card{
                background-color: lightcyan;
            }

        </style>

    </head>
    <body>

        <h1>my color card</h1>

        <i--inline css: add styles="color:blue:" inside this p tag -->
            <p style="color:crimson;">hi! this is my very own webpage</p>

            <div id="my-card">

                <h2>about me</h2>
                <p class="my-detail">my name is viraj</p>
            <p class="my-detail">my favorite color is blue</p>
            <p class="my-detail">my favorite subject is social studies</p>
            <p class="my-detail">my favourite food is butter chicken</p>
            
            </div>

            <h2>my favorite things</h2>
            <p>my favorite animal is a dog</p>
            <p>my favorite sport is cricket</p>
            <p>my favorite movie is godzilla</p>

    </body>
</html>
