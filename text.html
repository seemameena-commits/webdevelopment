<html>
    <head>
        <title>my super hero card</title>
        <style>
            body {
background-color: darkblue;
color: white;
font-family: arial, sams-serif;
            }
            .hero-name {
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 2px 3px orange;
            }
            .tagline {
                font-style: italic;
                color: lightblue;
                text-transform: capitize;
            }
            .lable {
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;
            }

            .power {
                font-weight: bold;
                color: lightgreen;
            }

            .weakness{
                text-decoration: line-through;
                color: gray;
            }
            .badge{
                font-size: 28 px;
                font-weight: bold;
                color: gold;
                transform: rotate(15deg);
            }

            .made-by{
                color:coral;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1 class="hero-name">thunder kid</h1>
        <p class="tagline">the most powerful hero in the school</p>
        <h2 class="lable">super powers</h2>
        <p class="power"> can run faster than a cheetah</p>
        <h2 class="lable">weaknesses</h2>
        <p class="weakness"> math homework</p>
        <p class="badge">top hero</p>
        <p class="made-by">created by________</p>
    </body>
</html>
