<html>
    <head>
        <title>my animal fact file</title>
        <style>

            body {
                background-color: yellow;
                font-family: arial, sans-serif;
            }
            .fact-file {
                background-color: lightyellow;
                color: darkslategray;
                width: 260px;
                padding:25px;
                border:10px solid forestgreen;
                margin:30px;
            }
            .animal-name {
                color: forestgreen;
                font-size:22px
            }
            .detail{
                color:darkslategray;
            }
            .cool-fact {
                color: darkorange;
                font-style: italic;
            }

        </style>
    </head>
    <body>
<div class="fact-file">
<h2 class="animal-name">snow leapard</h2>
<p class="detail">type: big cat</p>
<p class="detail">lives in mountains ranges of central asia</p>
<p class="detail">diet: deer, goats, and wild sheep</p>
<p class="cool-fact">cool fact: an leap up to 15 meters in 1 jump</p>
</div>
    
</body>
</html>
